name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare clean frontend artifact
        run: |
          mkdir -p _site
          cp index.html app.js style.css manifest.json _site/
          cp OneSignalSDKWorker.js OneSignalSDKUpdaterWorker.js _site/
          cp apple-touch-icon.png apple-touch-icon-precomposed.png sportschuetzen-muhen-intro.webm _site/
          cp -r icons app sportschuetzen-website vorstand kasse _site/

          # Entferne Test-, Backup- und lokale CLI-Hilfsdateien aus dem öffentlichen Web-Artefakt
          rm -f _site/kasse/test-twint.html
          rm -f _site/sportschuetzen-website/*.js
          rm -f _site/sportschuetzen-website/*.bat
          rm -f _site/sportschuetzen-website/*.ps1
          rm -f _site/sportschuetzen-website/*.md
          rm -f _site/vorstand/*.md
          find _site -name "*.bak*" -type f -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
